name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test || true

      - name: Setup Android Build Environment & Permissions
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release -v

      - name: Prepare APK File for Distribution
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk quran-app-release.apk
          else
            find build/ -name "*.apk" -exec cp {} quran-app-release.apk \;
          fi
          ls -lh quran-app-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-release
          path: quran-app-release.apk
          retention-days: 30

      - name: Publish GitHub Release with Direct Free Download
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: ${{ github.ref_type == 'tag' && format('تطبيق تحفيظ القرآن الكريم {0}', github.ref_name) || 'تطبيق تحفيظ القرآن الكريم v1.0.0 (ملف APK جاهز للتحميل)' }}
          body: |
            ## 📱 تطبيق تحفيظ القرآن الكريم والمصحف التفاعلي (Android APK)
            
            تم بناء ملف APK بنجاح وبشكل تلقائي ومجاني عبر خوادم **GitHub Actions CI/CD**.
            
            ---
            
            ### ⬇️ رابط التحميل المباشر والمجاني:
            👉 **[تحميل ملف APK المباشر (quran-app-release.apk)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}/quran-app-release.apk)**
            
            ---
            
            ### 🌟 أهم مميزات التحديث والتطبيق:
            1. **🎯 نظام طريقة الحفظ:** التبديل بنقرة واحدة بين **طريقة الصفحات** (مصحف المدينة 604 صفحات) أو **طريقة الأرباع** (240 ربعاً).
            2. **📖 صفحة المصحف المدني كاملة:** إطار مذهب وزخارف إسلامية أصيلة مع تظليل حي متزامن (`Live Highlighting`) للآية المقروءة.
            3. **📜 ضبط البسملة الشرعي:** البسملة ليست آية معدودة في سورة البقرة وعموم السور (بداية العد من "الم").
            4. **🎛️ تحديد السورة ونطاق الآيات:** اختيار أي سورة وتحديد نطاق مخصص (مثل: من الآية 1 إلى 5) مع تكرار `N × M` ووقفة ترديد `T`.
            5. **🎙️ المصحف المعلم (المنشاوي مع الأطفال):** تلاوة متقنة للشيخ يعقبها ترديد الأطفال بدون أي اقتطاع.
            6. **🎙️ تلاوة الشيخ الحصري:** صوت نقي بدون اقتطاع متزامن حرفياً مع الرسم العثماني.
          files: |
            quran-app-release.apk
          draft: false
          prerelease: false
